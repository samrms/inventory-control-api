name: CI

on:
    push:
        branches: [main, develop]

    pull_request:

jobs:
    unit-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Unit tests
              run: pnpm test:unit

    integration-tests:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: inventory_control_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Integration tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inventory_control_test
                  JWT_SECRET: test-secret-ci
              run: pnpm test:integration

    e2e-tests:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: inventory_control_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: E2E tests
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inventory_control_test
                  JWT_SECRET: test-secret-e2e
              run: pnpm test:e2e

    docker-integration:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Docker integration tests
              run: |
                  docker compose -f docker-compose.test.yml up -d --wait
                  sleep 5
                  DATABASE_URL="postgresql://postgres:postgres@localhost:5433/inventory_control_test" JWT_SECRET="test-secret-docker" pnpm test:unit
                  DATABASE_URL="postgresql://postgres:postgres@localhost:5433/inventory_control_test" JWT_SECRET="test-secret-docker" pnpm test:integration
                  DATABASE_URL="postgresql://postgres:postgres@localhost:5433/inventory_control_test" JWT_SECRET="test-secret-docker" pnpm test:e2e
                  docker compose -f docker-compose.test.yml down

    build:
        runs-on: ubuntu-latest
        needs: [unit-tests, integration-tests, e2e-tests, docker-integration]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t inventory-control-api .
