openapi: 3.1.0
info:
    title: Inventory Control API
    description: Per-warehouse inventory management with stock transfers, reservations, purchase orders, and audit logging.
    version: 2.0.0
    license:
        name: MIT

servers:
    - url: http://localhost:3000
      description: Local development

security:
    - bearerAuth: []

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    schemas:
        Error:
            type: object
            properties:
                error:
                    type: string
            required: [error]

        Pagination:
            type: object
            properties:
                page:
                    type: integer
                limit:
                    type: integer
                total:
                    type: integer
                totalPages:
                    type: integer

        Role:
            type: string
            enum: [ADMIN, MANAGER, OPERATOR]

        User:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                email:
                    type: string
                    format: email
                role:
                    $ref: '#/components/schemas/Role'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

        Product:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                sku:
                    type: string
                name:
                    type: string
                description:
                    type: string
                    nullable: true
                category:
                    type: string
                    nullable: true
                unit:
                    type: string
                price:
                    type: number
                cost:
                    type: number
                minimum_stock:
                    type: integer
                maximum_stock:
                    type: integer
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                deleted_at:
                    type: string
                    format: date-time
                    nullable: true

        Warehouse:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                code:
                    type: string
                name:
                    type: string
                description:
                    type: string
                    nullable: true
                address:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                deleted_at:
                    type: string
                    format: date-time
                    nullable: true

        InventoryItem:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                warehouse_id:
                    type: string
                    format: uuid
                product_id:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                reserved_quantity:
                    type: integer
                updated_at:
                    type: string
                    format: date-time
                warehouse_code:
                    type: string
                warehouse_name:
                    type: string
                sku:
                    type: string
                product_name:
                    type: string
                unit:
                    type: string
                available_stock:
                    type: integer

        Supplier:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                name:
                    type: string
                document:
                    type: string
                    nullable: true
                email:
                    type: string
                    nullable: true
                phone:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                deleted_at:
                    type: string
                    format: date-time
                    nullable: true

        Transfer:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                source_warehouse_id:
                    type: string
                    format: uuid
                destination_warehouse_id:
                    type: string
                    format: uuid
                status:
                    type: string
                    enum: [PENDING, COMPLETED, CANCELLED]
                created_by:
                    type: string
                    format: uuid
                notes:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                completed_at:
                    type: string
                    format: date-time
                    nullable: true
                source_code:
                    type: string
                source_name:
                    type: string
                dest_code:
                    type: string
                dest_name:
                    type: string
                created_by_name:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/TransferItem'

        TransferItem:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                transfer_id:
                    type: string
                    format: uuid
                product_id:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                received_quantity:
                    type: integer
                sku:
                    type: string
                product_name:
                    type: string

        Reservation:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                warehouse_id:
                    type: string
                    format: uuid
                product_id:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                status:
                    type: string
                    enum: [ACTIVE, RELEASED, FULFILLED, EXPIRED]
                reference:
                    type: string
                    nullable: true
                expires_at:
                    type: string
                    format: date-time
                    nullable: true
                created_by:
                    type: string
                    format: uuid
                created_at:
                    type: string
                    format: date-time
                warehouse_code:
                    type: string
                sku:
                    type: string
                product_name:
                    type: string
                created_by_name:
                    type: string

        PurchaseOrder:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                supplier_id:
                    type: string
                    format: uuid
                warehouse_id:
                    type: string
                    format: uuid
                status:
                    type: string
                    enum: [DRAFT, ORDERED, RECEIVED, CANCELLED]
                created_by:
                    type: string
                    format: uuid
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                supplier_name:
                    type: string
                warehouse_code:
                    type: string
                warehouse_name:
                    type: string
                created_by_name:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/PurchaseOrderItem'

        PurchaseOrderItem:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                purchase_order_id:
                    type: string
                    format: uuid
                product_id:
                    type: string
                    format: uuid
                quantity:
                    type: integer
                received_quantity:
                    type: integer
                unit_cost:
                    type: number
                sku:
                    type: string
                product_name:
                    type: string

        AuditLog:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                user_id:
                    type: string
                    format: uuid
                    nullable: true
                action:
                    type: string
                entity_type:
                    type: string
                entity_id:
                    type: string
                    format: uuid
                    nullable: true
                metadata:
                    type: object
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                user_name:
                    type: string
                    nullable: true

        StockMovement:
            type: object
            properties:
                id:
                    type: string
                    format: uuid
                warehouse_id:
                    type: string
                    format: uuid
                product_id:
                    type: string
                    format: uuid
                user_id:
                    type: string
                    format: uuid
                type:
                    type: string
                    enum:
                        [
                            RECEIPT,
                            ISSUE,
                            ADJUSTMENT_IN,
                            ADJUSTMENT_OUT,
                            TRANSFER_IN,
                            TRANSFER_OUT,
                        ]
                quantity:
                    type: integer
                reference_type:
                    type: string
                    nullable: true
                reference_id:
                    type: string
                    format: uuid
                    nullable: true
                reason:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                warehouse_code:
                    type: string
                sku:
                    type: string
                product_name:
                    type: string
                user_name:
                    type: string

        InventorySummary:
            type: object
            properties:
                total_products:
                    type: integer
                total_warehouses:
                    type: integer
                total_units:
                    type: integer
                reserved_units:
                    type: integer
                low_stock_items:
                    type: integer

    parameters:
        PageParam:
            name: page
            in: query
            schema:
                type: integer
                default: 1
                minimum: 1
        LimitParam:
            name: limit
            in: query
            schema:
                type: integer
                default: 20
                minimum: 1
                maximum: 100

paths:
    /health:
        get:
            summary: Health check
            security: []
            operationId: getHealth
            tags: [Health]
            responses:
                '200':
                    description: Service is healthy
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    timestamp:
                                        type: string
                                        format: date-time

    /api/v1/auth/register:
        post:
            summary: Register a new user
            security: []
            operationId: registerUser
            tags: [Auth]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, email, password]
                            properties:
                                name:
                                    type: string
                                    minLength: 1
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
                                    minLength: 6
                                role:
                                    $ref: '#/components/schemas/Role'
            responses:
                '201':
                    description: User registered
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/User'
                '400':
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: Email already in use
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/auth/login:
        post:
            summary: Login
            security: []
            operationId: loginUser
            tags: [Auth]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
            responses:
                '200':
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            token:
                                                type: string
                                            user:
                                                $ref: '#/components/schemas/User'
                '401':
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/users:
        get:
            summary: List users
            operationId: listUsers
            tags: [Users]
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/LimitParam'
            responses:
                '200':
                    description: Paginated user list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/User'
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'

    /api/v1/users/{id}:
        get:
            summary: Get user by ID
            operationId: getUserById
            tags: [Users]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: User found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/User'
                '404':
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

        patch:
            summary: Update user
            operationId: updateUser
            tags: [Users]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                email:
                                    type: string
                                    format: email
                                role:
                                    $ref: '#/components/schemas/Role'
            responses:
                '200':
                    description: User updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/User'
                '404':
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

        delete:
            summary: Delete user
            operationId: deleteUser
            tags: [Users]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '204':
                    description: User deleted
                '404':
                    description: User not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/products:
        get:
            summary: List products
            operationId: listProducts
            tags: [Products]
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/LimitParam'
                - name: search
                  in: query
                  schema:
                      type: string
                  description: Search by name, SKU, or description
                - name: category
                  in: query
                  schema:
                      type: string
            responses:
                '200':
                    description: Paginated product list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Product'
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'

        post:
            summary: Create product
            operationId: createProduct
            tags: [Products]
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [sku, name]
                            properties:
                                sku:
                                    type: string
                                    minLength: 1
                                name:
                                    type: string
                                    minLength: 1
                                description:
                                    type: string
                                category:
                                    type: string
                                unit:
                                    type: string
                                    default: unit
                                price:
                                    type: number
                                    minimum: 0
                                    default: 0
                                cost:
                                    type: number
                                    minimum: 0
                                    default: 0
                                minimumStock:
                                    type: integer
                                    minimum: 0
                                    default: 0
                                maximumStock:
                                    type: integer
                                    minimum: 0
                                    default: 0
            responses:
                '201':
                    description: Product created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Product'
                '400':
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: SKU already exists
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/products/{id}:
        get:
            summary: Get product by ID
            operationId: getProductById
            tags: [Products]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Product found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Product'
                '404':
                    description: Product not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

        patch:
            summary: Update product
            operationId: updateProduct
            tags: [Products]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                description:
                                    type: string
                                category:
                                    type: string
                                unit:
                                    type: string
                                price:
                                    type: number
                                    minimum: 0
                                cost:
                                    type: number
                                    minimum: 0
                                minimumStock:
                                    type: integer
                                    minimum: 0
                                maximumStock:
                                    type: integer
                                    minimum: 0
            responses:
                '200':
                    description: Product updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Product'
                '404':
                    description: Product not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

        delete:
            summary: Delete product
            operationId: deleteProduct
            tags: [Products]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '204':
                    description: Product deleted
                '404':
                    description: Product not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/warehouses:
        get:
            summary: List warehouses
            operationId: listWarehouses
            tags: [Warehouses]
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/LimitParam'
                - name: search
                  in: query
                  schema:
                      type: string
                  description: Search by name or code
            responses:
                '200':
                    description: Paginated warehouse list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Warehouse'
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'

        post:
            summary: Create warehouse
            operationId: createWarehouse
            tags: [Warehouses]
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [code, name]
                            properties:
                                code:
                                    type: string
                                    minLength: 1
                                name:
                                    type: string
                                    minLength: 1
                                description:
                                    type: string
                                address:
                                    type: string
            responses:
                '201':
                    description: Warehouse created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Warehouse'
                '400':
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '409':
                    description: Warehouse code already exists
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/warehouses/{id}:
        get:
            summary: Get warehouse by ID
            operationId: getWarehouseById
            tags: [Warehouses]
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Warehouse found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Warehouse'
                '404':
                    description: Warehouse not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

        patch:
            summary: Update warehouse
            operationId: updateWarehouse
            tags: [Warehouses]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                description:
                                    type: string
                                address:
                                    type: string
            responses:
                '200':
                    description: Warehouse updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/Warehouse'
                '404':
                    description: Warehouse not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

        delete:
            summary: Delete warehouse
            operationId: deleteWarehouse
            tags: [Warehouses]
            security:
                - bearerAuth: []
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '204':
                    description: Warehouse deleted
                '404':
                    description: Warehouse not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/inventory:
        get:
            summary: List inventory
            operationId: listInventory
            tags: [Inventory]
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/LimitParam'
                - name: warehouseId
                  in: query
                  schema:
                      type: string
                      format: uuid
                - name: productId
                  in: query
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Paginated inventory list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/InventoryItem'
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'

    /api/v1/inventory/summary:
        get:
            summary: Inventory summary
            operationId: getInventorySummary
            tags: [Inventory]
            responses:
                '200':
                    description: Inventory summary
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/InventorySummary'

    /api/v1/inventory/low-stock:
        get:
            summary: Low stock items
            operationId: getLowStock
            tags: [Inventory]
            parameters:
                - $ref: '#/components/parameters/PageParam'
                - $ref: '#/components/parameters/LimitParam'
            responses:
                '200':
                    description: Paginated low stock list
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/InventoryItem'
                                    pagination:
                                        $ref: '#/components/schemas/Pagination'

    /api/v1/inventory/{warehouseId}/{productId}:
        get:
            summary: Get inventory by warehouse and product
            operationId: getInventoryByWarehouseAndProduct
            tags: [Inventory]
            parameters:
                - name: warehouseId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
                - name: productId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Inventory entry found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        $ref: '#/components/schemas/InventoryItem'
                '404':
                    description: Inventory entry not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /api/v1/inventory/receive:
        post:
            summary: Receive stock
            operationId: receiveStock
            tags: [Inventory]
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [warehouseId, productId, quantity]
                            properties:
                                warehouseId:
                                    type: string
                                    format: uuid
                                productId:
                                    type: string
