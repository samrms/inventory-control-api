services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: inventory_control
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 2s
            timeout: 5s
            retries: 10

    api:
        build: .
        ports:
            - '3000:3000'
        environment:
            PORT: 3000
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inventory_control
            JWT_SECRET: change-me-in-production
            NODE_ENV: production
        depends_on:
            postgres:
                condition: service_healthy
